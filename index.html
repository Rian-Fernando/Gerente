<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Title, description, canonical, Open Graph, Twitter card and JSON-LD are
      injected at build time by scripts/seo-html-plugin.js, generated from
      src/constants/siteInfo.js so the copy has a single source of truth.
      Everything below is the part that is not derived from that copy.
    -->

    <link rel="icon" type="image/svg+xml" href="/brand/gerente-favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand/gerente-app-icon.svg" />
    <link rel="mask-icon" href="/brand/gerente-mark-mono.svg" color="#111114" />

    <meta name="theme-color" content="#F4F1EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--seo-shell-->
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
